# ── Soundwave AI — Docker Compose ─────────────────────────────────────────
# Production topology: Postgres + API + Caddy (frontend static files, automatic
# free HTTPS, and reverse proxy — all same-origin, so auth cookies just work).
#
# Deploy:
#   1. Build the frontend:   cd frontend && npm ci && npm run build && cd ..
#   2. Create .env in THIS directory with the values referenced below
#      (compose reads root .env — different from server/.env used in dev)
#   3. docker compose up -d --build
#
# The API auto-selects the Prisma store when DATABASE_URL is a postgres URL;
# without it, it falls back to the JSON file store (useful for smoke tests).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: soundwave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: soundwave
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundwave"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Public origin of the site (https). Cookies are Secure + SameSite=Strict
      # in production, so the site must be reachable over HTTPS at this URL.
      APP_URL: ${APP_URL:?set APP_URL in .env, e.g. https://1.2.3.4.sslip.io}
      # Extra comma-separated origins allowed to call the API cross-site.
      # Not needed in the default same-origin setup.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Caddy is in front of the API here, so it is the thing that knows the
      # real client address: trust exactly one hop. Without this every request
      # looks like it comes from the proxy's own address and the rate limits
      # count all users together; with anything more than 1 a client could
      # forge its own address (server/src/lib/security.ts).
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # A hosted deploy must not silently come up on the empty local JSON store
      # when Postgres is unreachable — every existing account would look gone.
      # Set ALLOW_JSON_FALLBACK=1 if that is genuinely what you want.
      ALLOW_JSON_FALLBACK: ${ALLOW_JSON_FALLBACK:-0}
      DATABASE_URL: postgresql://soundwave:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/soundwave
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      # Plan given to new signups. MUST stay FREE in production.
      DEFAULT_SIGNUP_PLAN: ${DEFAULT_SIGNUP_PLAN:-FREE}
      # Email (Resend — free tier is enough for verification/reset mails).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Soundwave AI <no-reply@soundwave.ai>}
      # Payments (optional — billing returns a clear error until set).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_PRICE_PRO_ANNUAL: ${STRIPE_PRICE_PRO_ANNUAL:-}
      STRIPE_PRICE_ENTERPRISE_MONTHLY: ${STRIPE_PRICE_ENTERPRISE_MONTHLY:-}
      STRIPE_PRICE_ENTERPRISE_ANNUAL: ${STRIPE_PRICE_ENTERPRISE_ANNUAL:-}
      # Where Stripe lives; only tests/a mirror change this.
      STRIPE_API_BASE: ${STRIPE_API_BASE:-}
      # Google (the one way into the app; a "Desktop app" OAuth client).
      SOUNDWAVE_YOUTUBE_CLIENT_ID: ${SOUNDWAVE_YOUTUBE_CLIENT_ID:-}
      SOUNDWAVE_YOUTUBE_CLIENT_SECRET: ${SOUNDWAVE_YOUTUBE_CLIENT_SECRET:-}
      # Voice cloning sidecar (optional — feature hides when unset).
      VOICECLONE_URL: ${VOICECLONE_URL:-}
      VOICECLONE_TOKEN: ${VOICECLONE_TOKEN:-}
      VOICECLONE_MIN_PLAN: ${VOICECLONE_MIN_PLAN:-FREE}
      # The container image installs ffmpeg/yt-dlp from apk (multi-arch).
      FFMPEG_PATH: /usr/bin/ffmpeg
      DATA_DIR: /app/data
      UPLOADS_DIR: /app/data/uploads
    volumes:
      - appdata:/app/data
    # The app registers SIGTERM/SIGINT handlers that stop their schedulers,
    # close the listener and flush the store (server/src/index.ts). Give that
    # the time to finish rather than SIGKILLing it 10 seconds in — a render in
    # flight or a debounced write would be lost.
    stop_grace_period: 30s
    # The API image's own HEALTHCHECK (deploy/Dockerfile.api) probes
    # /api/ready: it also fails when the data store could not be read, or when
    # a production deploy came up on the local JSON fallback.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Set to your public hostname (e.g. 1.2.3.4.sslip.io or soundwave.ai).
      # Caddy obtains and renews a free Let's Encrypt certificate for it
      # automatically. Must match the host in APP_URL.
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. 1.2.3.4.sslip.io}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
