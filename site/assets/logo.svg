<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" width="220" height="48" role="img" aria-label="Soundwave AI">
  <title>Soundwave AI</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6" />
      <stop offset="1" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="w" x1="60" y1="14" x2="200" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93C5FD" />
      <stop offset="1" stop-color="#C4B5FD" />
    </linearGradient>
  </defs>

  <!-- mark -->
  <rect x="2" y="2" width="44" height="44" rx="11" fill="#0A0F1C" />
  <rect x="2" y="2" width="44" height="44" rx="11" fill="none" stroke="url(#g)" stroke-width="2" />
  <g stroke="url(#g)" stroke-width="3.2" stroke-linecap="round">
    <path d="M9 20v8" />
    <path d="M15 14v20" />
    <path d="M21 9v30" />
    <path d="M27 17v14" />
    <path d="M33 12v24" />
    <path d="M39 16v16" />
  </g>
  <circle cx="40" cy="9" r="3" fill="#8B5CF6" />

  <!-- wordmark -->
  <text x="58" y="32" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="-0.6" fill="#F4F6FB">Soundwave</text>
  <text x="172" y="32" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="-0.6" fill="url(#w)">AI</text>
