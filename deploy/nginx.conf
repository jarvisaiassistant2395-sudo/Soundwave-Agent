# ── Soundwave AI — Nginx reverse proxy ────────────────────────────────────
server {
    listen 80;
    server_name _;
    client_max_body_size 500m;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. The CSP is the SAME policy the API serves from helmet
    # (server/src/lib/security.ts CSP_DIRECTIVES) — this used to be a looser
    # hand-written copy ('unsafe-inline' styles, frame-ancestors 'self') that
    # behaved differently from the packaged app. server/tests/csp.test.ts fails
    # if the two ever disagree again.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self';script-src 'self';style-src 'self' https://fonts.googleapis.com;font-src 'self' https://fonts.gstatic.com;img-src 'self' data: blob:;media-src 'self' blob:;connect-src 'self';frame-ancestors 'none';base-uri 'self';form-action 'self';object-src 'none';script-src-attr 'none';upgrade-insecure-requests" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API reverse proxy with SSE support
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Voice sample audio
    location /voice-samples/ {
        proxy_pass http://api:4000;
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
}
